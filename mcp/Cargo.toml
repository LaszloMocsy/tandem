[package]
name = "tandem-board-mcp"
description = "MCP server for Tandem, built on tandem-board-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tandem-board-core.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "rt", "macros"] }
tokio-util = "0.7.20"

[dev-dependencies]
reqwest = "0.13.5"
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
