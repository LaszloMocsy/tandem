[package]
name = "tandem-board-core"
description = "Task database and service for Tandem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dirs = "7.0.0"
getrandom = "0.4.3"
jiff = { version = "0.2.38", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
