[package]
name = "tandem-board-core"
description = "Task store, index and service for Tandem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
