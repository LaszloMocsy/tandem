name: Version

# Only release/vX.Y.Z branches merge into main, each with a version higher
# than main's. Feature branches merge into a release branch, which this
# workflow doesn't run for. Make the Version check required for main in the
# branch protection settings.
on:
  pull_request:
    branches: [main]
    # edited: re-run when a pull request is retargeted to main.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # The merge commit, so the version files are checked as they'd land.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Reads the pull request from the Actions environment and fetches main
      # to compare against.
      - name: Check the version
        run: cargo --locked xtask version check pr
