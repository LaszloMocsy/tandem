name: Release

# Pushing a tag such as v0.1.0 builds macOS, Windows and Linux bundles into a
# draft GitHub release, which you then review and publish by hand. Tags
# vX.Y.Z-alpha.N and vX.Y.Z-beta.N build labelled ALPHA and BETA pre-releases;
# any other tag fails. The Tag workflow starts it through workflow_dispatch
# on the tag it creates; a dispatch on a branch fails.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs, since this workflow can
# write releases. No build cache either, so nothing from other runs can end
# up in a release bundle.

jobs:
  # One job creates the draft, so the build jobs don't race to create one
  # each: GitHub's lookup by tag doesn't see drafts.
  create-release:
    name: Create draft release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.id }}
      build-env: ${{ steps.env.outputs.env }}
    steps:
      - name: Check this runs for a tag
        if: github.ref_type != 'tag'
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::Release runs for a tag, not the branch $REF"
          exit 1

      # Every tag, so the release notes can start from the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # For the version tooling in xtask/.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # alpha, beta, or empty for a production release. Fails on any other tag.
      - name: Read the build environment from the tag
        id: env
        env:
          TAG: ${{ github.ref_name }}
        run: |
          env=$(cargo --locked xtask version env "$TAG")
          echo "env=$env" >> "$GITHUB_OUTPUT"

      # Cargo.toml, tauri.conf.json and Cargo.lock must agree with the tag.
      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: cargo --locked xtask version check release "$TAG"

      # GitHub generates the notes from the pull requests merged since the
      # previous release, grouped by .github/release.yml: since the last
      # production tag for a production release, so it covers the
      # pre-releases too, or since the last tag for a pre-release.
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.env.outputs.env != '' }}
        run: |
          previous=$(cargo --locked xtask version previous-tag "$TAG")
          args=(-f tag_name="$TAG")
          if [ -n "$previous" ]; then args+=(-f previous_tag_name="$previous"); fi
          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body)

          cat > notes.md <<EOF
          Download the bundle for your platform below.

          These builds are not signed, so macOS and Windows warn before the first launch. See [Installing an unsigned build](https://github.com/$GITHUB_REPOSITORY#installing-an-unsigned-build) in the README.

          EOF
          printf '%s\n' "$changes" >> notes.md

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Tandem $TAG" -F draft=true -F prerelease="$PRERELEASE" -F body=@notes.md --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple silicon
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS, Intel
            platform: macos-latest
            target: x86_64-apple-darwin
          # An older Ubuntu than CI's, so the bundles run on older glibc too.
          - name: Linux
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # System libraries Tauri needs on Linux: https://v2.tauri.app/start/prerequisites/
      # patchelf is for the AppImage.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # tauri.conf.json's beforeBuildCommand runs `bun run build` in ui/.
      - name: Install frontend dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compiled into the app and its frontend; empty for production.
          TANDEM_ENV: ${{ needs.create-release.outputs.build-env }}
        with:
          # The Tauri project lives in desktop/, not the template's src-tauri/.
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release-id }}
          releaseDraft: true
          # The MSI bundler refuses versions like 0.2.0-alpha.1, so Windows
          # pre-releases ship the NSIS installer only.
          args: >-
            --target ${{ matrix.target }}
            ${{ runner.os == 'Windows' && needs.create-release.outputs.build-env != '' && '--bundles nsis' || '' }}
          # The app has no updater.
          uploadUpdaterJson: false
