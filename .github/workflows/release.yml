name: Release

# Builds a release tag's macOS, Windows and Linux bundles into a draft GitHub
# release, which you then review and publish by hand. A tag vX.Y.Z builds a
# stable release with every bundle; a tag vX.Y.Z-beta.N builds a pre-release
# labelled BETA; any other tag fails. The Tag workflow starts it for a stable
# release, and the Beta workflow for a beta, through workflow_dispatch on the
# tag each creates. A dispatch on a branch fails; run Beta for that.
#
# The version files on a tag hold X.Y.Z, even for a beta, so each build first
# sets them to the tag's version. Bundlers that refuse or misorder the
# -beta.N suffix are left out of betas: the MSI and RPM refuse it, and dpkg
# would sort a beta's .deb above its stable release. Betas ship the macOS
# app and .dmg, the Windows NSIS installer and the Linux AppImage, which are
# also what the updater installs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs, since this workflow can
# write releases. No build cache either, so nothing from other runs can end
# up in a release bundle.

jobs:
  # One job creates the draft, so the build jobs don't race to create one
  # each: GitHub's lookup by tag doesn't see drafts.
  create-release:
    name: Create draft release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.id }}
      build-env: ${{ steps.env.outputs.env }}
    steps:
      - name: Check this runs for a tag
        if: github.ref_type != 'tag'
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::Release runs for a tag, not the branch $REF. To build a beta from a release branch, run the Beta workflow on it."
          exit 1

      # Every tag, so the release notes can start from the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # For the version tooling in xtask/.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # beta, or production for a stable release. Fails on any other tag.
      - name: Read the build environment from the tag
        id: env
        env:
          TAG: ${{ github.ref_name }}
        run: |
          env=$(cargo --locked xtask version env "$TAG")
          echo "env=$env" >> "$GITHUB_OUTPUT"

      # Cargo.toml, tauri.conf.json and Cargo.lock must hold X.Y.Z for the tag
      # vX.Y.Z or vX.Y.Z-beta.N.
      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: cargo --locked xtask version check release "$TAG"

      # The update feeds (site/src/pages/updates/) show only what follows
      # the <!-- changes --> marker in the app's update dialog.
      # GitHub generates the notes from the pull requests merged since the
      # previous release, grouped by .github/release.yml: since the last
      # stable tag for a stable release, so it covers the betas too, or since
      # the last tag of any kind for a beta.
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.env.outputs.env == 'beta' }}
        run: |
          previous=$(cargo --locked xtask version previous-tag "$TAG")
          args=(-f tag_name="$TAG")
          if [ -n "$previous" ]; then args+=(-f previous_tag_name="$previous"); fi
          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body)

          cat > notes.md <<EOF
          Download the bundle for your platform below.

          These builds are not signed, so macOS and Windows warn before the first launch. See [Installing an unsigned build](https://github.com/$GITHUB_REPOSITORY#installing-an-unsigned-build) in the README.

          <!-- changes -->
          EOF
          printf '%s\n' "$changes" >> notes.md

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Tandem $TAG" -F draft=true -F prerelease="$PRERELEASE" -F body=@notes.md --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # beta-bundles: what a beta builds, or empty for every bundle. A stable
      # release always builds every bundle.
      matrix:
        include:
          - name: macOS, Apple silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            beta-bundles: ''
          - name: macOS, Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            beta-bundles: ''
          # An older Ubuntu than CI's, so the bundles run on older glibc too.
          - name: Linux
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            beta-bundles: appimage
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            beta-bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      # Updates are signed with this key, and the app refuses any other.
      - name: Check the updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=Missing updater key::Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets; see CONTRIBUTING.md."
            exit 1
          fi

      - uses: actions/checkout@v7

      # System libraries Tauri needs on Linux: https://v2.tauri.app/start/prerequisites/
      # patchelf is for the AppImage.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # A beta tag's X.Y.Z-beta.N, so the app, its bundles and latest.json
      # carry the beta's version. Leaves a stable tag's files as they are.
      # Only this checkout changes; nothing is committed.
      - name: Set the version for this build
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: cargo --locked xtask version stamp "$TAG"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # tauri.conf.json's beforeBuildCommand runs `bun run build` in ui/.
      - name: Install frontend dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compiled into the app and its frontend: beta or production. Left
          # unset, as in a local build, it would be a dev build.
          TANDEM_ENV: ${{ needs.create-release.outputs.build-env }}
          # Signs the update bundles that tauri.conf.json's
          # createUpdaterArtifacts asks for.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The Tauri project lives in desktop/, not the template's src-tauri/.
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release-id }}
          releaseDraft: true
          args: >-
            --target ${{ matrix.target }}
            ${{ needs.create-release.outputs.build-env == 'beta' && matrix.beta-bundles != '' && format('--bundles {0}', matrix.beta-bundles) || '' }}
          # latest.json, which the site's update feeds serve. Each build adds
          # its platform to the one manifest on the release.
          uploadUpdaterJson: true
          # Windows updates use the NSIS installer, like the downloads and
          # every beta, so an MSI never installs over an NSIS install.
          updaterJsonPreferNsis: true

  # The builds each add their platform to latest.json at the same time, so
  # check none was lost before the release can be published.
  check-manifest:
    name: Check the updater manifest
    needs: [create-release, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check latest.json lists every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset" ]; then
            echo "::error::The release has no latest.json"
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          missing=""
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' latest.json \
              > /dev/null || missing="$missing $platform"
          done
          if [ -n "$missing" ]; then
            echo "::error::latest.json is missing:$missing. Re-run the failed builds before publishing."
            exit 1
          fi
