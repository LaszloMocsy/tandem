# Groups the generated release notes by pull request label. The Release
# workflow generates them when it creates the draft release.
changelog:
  exclude:
    # For pull requests that don't belong in the notes, such as version/vX.Y.Z
    # pull requests, whose feature pull requests are listed already.
    labels: [skip-release-notes]
  categories:
    - title: New features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ['*']
