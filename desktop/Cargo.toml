[package]
name = "tandem-board-desktop"
description = "Tandem desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tandem-board-core.workspace = true
tandem-board-mcp.workspace = true
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2.38"
tokio-util = "0.7.20"
tauri-plugin-dialog = "2.8.3"

[dev-dependencies]
tempfile = "3.27.0"
