[package]
name = "tandem-board-desktop"
description = "Tandem desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary carries the product name, so the Dock and app switcher show "Tandem" in dev runs too.
[[bin]]
name = "Tandem"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tandem-board-core.workspace = true
tandem-board-mcp.workspace = true
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2.38"
tokio-util = "0.7.20"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
